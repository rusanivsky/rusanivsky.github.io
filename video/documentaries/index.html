<script>
(function(){
  var root=document.documentElement;
  function setLang(v,save){
    root.setAttribute('lang', v==='ua'?'uk':'en');
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t=el.getAttribute('data-'+v); if(t) el.textContent=t;
    });
    if(save){
      try{ localStorage.setItem('kr-lang',v); }catch(e){}
      try{ var u=new URL(location.href);
        if(v==='ua'){u.searchParams.set('lang','uk');} else {u.searchParams.delete('lang');}
        history.replaceState(null,'',u);
      }catch(e){}
    }
    document.querySelectorAll('#lang button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.lang===v));
    });
  }
  function detect(){
    try{ var q=new URLSearchParams(location.search).get('lang');
      if(q==='uk'||q==='ua') return 'ua'; if(q==='en') return 'en';
    }catch(e){}
    try{ var s=localStorage.getItem('kr-lang'); if(s==='en'||s==='ua') return s; }catch(e){}
    var l=navigator.languages||[navigator.language||''];
    for(var i=0;i<l.length;i++){ var x=String(l[i]).toLowerCase();
      if(x.indexOf('uk')===0) return 'ua'; if(x.indexOf('en')===0) return 'en'; }
    return 'en';
  }
  document.querySelectorAll('#lang button').forEach(function(b){
    b.addEventListener('click',function(){ setLang(b.dataset.lang,true); });
  });
  try{ setLang(detect(),false); }catch(e){ setLang('en',false); }
  document.addEventListener('click',function(e){
    var f=e.target.closest('.fac'); if(!f) return;
    var pl=f.dataset.pl, id=f.dataset.id;
    var src = pl==='yt'
      ? 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0'
      : 'https://player.vimeo.com/video/'+id+'?autoplay=1';
    var fr=document.createElement('iframe');
    fr.src=src; fr.title=f.getAttribute('aria-label')||'';
    fr.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    fr.setAttribute('allowfullscreen','');
    fr.loading='lazy';
    f.replaceWith(fr);
  });
})();
</script>
