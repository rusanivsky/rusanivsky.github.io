<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!--
  Source of /og-image.jpg. Rendered by a real browser against the site's own
  font and colour tokens, so the card cannot drift away from the site — and
  a drifting card is invisible until someone posts the link.

  The composition is the site's own: an index column on four of twelve, a
  stage of work on the remaining eight.
-->
<style>
@font-face{font-family:Fixel;src:url(/fonts/fixel-latin.woff2) format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:Fixel;src:url(/fonts/fixel-cyrillic.woff2) format('woff2');font-weight:100 900;font-display:block;unicode-range:U+0400-045F}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#f4f1e9;color:#111;font-family:Fixel,sans-serif;
  display:grid;grid-template-columns:repeat(12,1fr);column-gap:14px;
  padding:52px 56px;
}
.idx{grid-column:1/span 4;display:flex;flex-direction:column}
.mark{font-size:15px;font-weight:600;letter-spacing:.17em;text-transform:uppercase}
.name{margin-top:auto;font-size:56px;font-weight:500;letter-spacing:-.025em;line-height:1.02}
.rule{margin:22px 0 16px;height:1px;background:#d9d3c5}
.practices{display:flex;flex-direction:column;gap:5px}
.practices span{font-size:16px;color:#6d675c}
.foot{margin-top:26px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a09889}

/* The stage: the collage rhythm in miniature — three columns, frames at
   different levels, generous air. */
.stage{grid-column:6/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:center}
.stage figure{background:#ebe7db;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.a{height:300px;align-self:start;margin-top:26px}
.b{height:360px;align-self:start}
.c{height:250px;align-self:start;margin-top:74px}
</style></head>
<body>
  <div class="idx">
    <div class="mark">Rusanivsky</div>
    <div class="name">Kyrylo<br>Rusanivsky</div>
    <div class="rule"></div>
    <div class="practices">
      <span>Photography</span><span>Video</span><span>Graphic design</span>
    </div>
    <div class="foot">Kyiv · Selected work</div>
  </div>
  <div class="stage">
    <figure class="a"><img src="/media/photo/concerts-theatre/04-concerts-theatre-001.webp" alt=""></figure>
    <figure class="b"><img src="/media/video/posters/dyvoshyv-poster.jpg" alt=""></figure>
    <figure class="c"><img src="/media/design/istoriya-ukrayini-2020.webp" alt=""></figure>
  </div>
</body></html>
