<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:Fixel;src:url(/fonts/fixel-latin.woff2) format('woff2');font-weight:100 900}
body{margin:0;background:#8a8a88;font:11px/1.6 system-ui;color:#fff;padding:24px}
.g{display:flex;gap:16px;align-items:flex-end;margin:6px 0 20px}
.cap{text-align:center;opacity:.85}
h3{font:600 12px system-ui;margin:14px 0 0}
.ios{display:flex;gap:18px;margin:8px 0 20px}
.ios div{width:120px;height:120px;border-radius:27px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ios img{width:100%;height:100%;display:block}
.wall{padding:16px;border-radius:14px}
.cmp{background:#f4f1e9;color:#111;font-family:Fixel;font-weight:600;font-size:96px;padding:12px 18px;width:max-content;display:flex;align-items:center;gap:14px}

<h3>Фавікон, світла тема</h3>
<div class=g><img src=/favicon.svg?x width=16><div class=cap>16</div><img src=/favicon.svg?x width=32><div class=cap>32</div><img src=/favicon.svg?x width=64><div class=cap>64</div></div>
<h3>Фавікон, темна тема</h3>
<div class=g><img src=/favicon-dark.svg?x width=16><div class=cap>16</div><img src=/favicon-dark.svg?x width=32><div class=cap>32</div><img src=/favicon-dark.svg?x width=64><div class=cap>64</div></div>
<h3>iOS: домашній екран / бібліотека застосунків</h3>
<div class=ios>
  <div class=wall style="background:#d9d6cf"><img src=/apple-touch-icon.png?x></div>
  <div class=wall style="background:#23231f"><img src=/apple-touch-icon-dark.png?x></div>
</div>
<h3>Звірка з живим Fixel 600</h3>
