name: Gallery layout
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Geometry, source preservation and deterministic live build
        run: node --test --test-concurrency=1 tests/gallery-layout.test.cjs tests/gallery-build.test.mjs tests/street-section.test.mjs tests/design-cases.test.mjs tests/design-masonry.test.cjs tests/video-player.test.mjs tests/video-player-runtime.test.mjs tests/video-focus.test.mjs
      - name: Tembrava EULA, languages, links and metadata
        run: python3 tests/tembrava-license-acceptance.py
      - name: Generated pages are committed
        run: git diff --exit-code
