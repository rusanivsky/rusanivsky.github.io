<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Закрита сторінка</title>
<style>
:root{
  --ground:#FAF7F0; --surface:#FFFFFF; --line:#E2D9C8; --ink:#1A1816; --ink-2:#4A443D;
  --muted:#7C7368; --accent:#A81C2B; --accent-soft:#F6E4E3;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#171614; --surface:#201F1C; --line:#3A3730; --ink:#EFEADF; --ink-2:#C6BFB2;
  --muted:#8E867A; --accent:#E4707C; --accent-soft:#3A2226;
}}
:root[data-theme="dark"]{
  --ground:#171614; --surface:#201F1C; --line:#3A3730; --ink:#EFEADF; --ink-2:#C6BFB2;
  --muted:#8E867A; --accent:#E4707C; --accent-soft:#3A2226;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);
  display:flex;align-items:center;justify-content:center;padding:32px 16px;line-height:1.6}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -20px rgba(0,0,0,.4)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px}
h1{font-size:19px;line-height:1.3;margin:0 0 6px;font-weight:650}
p.sub{margin:0 0 20px;color:var(--ink-2);font-size:14px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:12px 14px;font-size:20px;letter-spacing:.34em;text-align:center;
  font-family:var(--f-mono);border:1px solid var(--line);border-radius:9px;
  background:var(--ground);color:var(--ink);-webkit-appearance:none}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:12px;padding:12px 14px;font-size:15px;font-weight:600;
  border:0;border-radius:9px;background:var(--ink);color:var(--ground);cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
p.msg{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--accent)}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12.5px;color:var(--ink-2);cursor:pointer;letter-spacing:0}
.remember input{
  -webkit-appearance:checkbox;appearance:checkbox;   /* повертаємо те, що загальне правило input{} зняло */
  width:17px;height:17px;flex:0 0 auto;margin:0;padding:0;border:0;border-radius:0;
  background:none;accent-color:var(--accent);cursor:pointer}
p.note{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <p class="eyebrow">Приватний звіт</p>
  <h1>Сторінка під піном</h1>
  <p class="sub">Вміст зашифровано. Введіть чотиризначний пін, щоб відкрити.</p>
  <form id="f" autocomplete="off">
    <label for="pin">ПІН</label>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
           spellcheck="false" aria-label="Чотиризначний пін" autofocus>
    <button id="go" type="submit">Відкрити</button>
    <label class="remember"><input type="checkbox" id="rem" checked> Запам'ятати на цьому пристрої</label>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <p class="note">Звіт спільний: позначки бачать усі, хто його відкрив, з будь-якого пристрою. Підпишіться своїм іменем угорі — і буде видно, хто що закрив.</p>
</main>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f=document.getElementById('f'), pin=document.getElementById('pin'),
      go=document.getElementById('go'), msg=document.getElementById('msg'),
      rem=document.getElementById('rem');
  var PIN_KEY='nibu-pin-v1';
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function b64(s){ var r=atob(s), a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
  pin.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); f.requestSubmit ? f.requestSubmit() : go.click(); }
  });
  function open(v, silent){
    if(!/^[0-9]{4}$/.test(v)){ if(!silent){ msg.textContent='Потрібні чотири цифри.'; } return; }
    if(!(window.crypto && crypto.subtle)){
      msg.textContent='Браузер не підтримує розшифрування. Відкрийте сторінку через https.'; return; }
    go.disabled=true; msg.style.color='var(--muted)';
    msg.textContent = silent ? 'Відкриваю…' : 'Розшифровую…';
    crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey'])
     .then(function(base){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
          base, {name:'AES-GCM', length:256}, false, ['decrypt']);
     })
     .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct)); })
     .then(function(buf){
        if(rem && rem.checked) lsSet(PIN_KEY, v); else lsDel(PIN_KEY);
        var html=new TextDecoder('utf-8').decode(buf);
        var boot='<scr'+'ipt>window.__MARKS_PIN='+JSON.stringify(v)+';</scr'+'ipt>';
        html=html.replace('<!--MARKS_BOOT-->', boot);
        document.open(); document.write(html); document.close();
     })
     .catch(function(){
        lsDel(PIN_KEY);                       // збережений пін більше не підходить
        go.disabled=false; msg.style.color='var(--accent)';
        msg.textContent = silent ? 'Збережений пін більше не підходить — введіть заново.' : 'Пін не підходить.';
        pin.value=''; pin.focus();
     });
  }

  // Галочка «запам'ятати» стоїть у першого ж відвідувача. Ставимо її з коду, а
  // не покладаємось на атрибут: браузер при перезавантаженні відновлює
  // попередній стан форми, і людина, яка раз її зняла, більше б її не побачила.
  var REM_KEY='nibu-rem-v1';
  if(rem){
    rem.checked = (lsGet(REM_KEY) !== '0');
    rem.addEventListener('change', function(){ lsSet(REM_KEY, rem.checked ? '1' : '0'); });
  }

  // збережений пін — пробуємо мовчки, поки людина ще не встигла нічого ввести
  var saved=lsGet(PIN_KEY);
  if(saved){ open(saved, true); }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var v=(pin.value||'').trim();
    open(v, false);
  });
})();
</script>
