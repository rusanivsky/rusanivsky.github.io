<style>
@font-face{
  font-family:"Fixel";
  src:url("/fixel-latin.woff2") format("woff2");
  font-weight:100 900; font-stretch:75% 100%;
  font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0100-017F,U+2010-2027,U+2190-2199,U+20AC;
}
@font-face{
  font-family:"Fixel";
  src:url("/fixel-cyrillic.woff2") format("woff2");
  font-weight:100 900; font-stretch:75% 100%;
  font-style:normal; font-display:swap;
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
:root{
  --ease:cubic-bezier(.16,1,.3,1);
  --pencil:#d64427;
  --bg:#f2f0ea; --ink:#201e1d; --accent:var(--ink);
  /* підвал — глибокий темно-сірий, однаковий у обох темах */
  --deep:#333230; --deep-ink:#f2f0ea;
  --pad:clamp(16px,3.2vw,48px);
  /* волосяна лінійка розділювачів і товща лінія, яку малює ховер */
  --rule:1px; --pen:2px;
  /* далі 14" MacBook Pro Retina верстка не росте */
  --maxw:1512px;
  --divider:color-mix(in srgb,#201e1d 40%,transparent);
  --mute:color-mix(in srgb,#201e1d 52%,transparent);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#171615; --ink:#f0eeec;
    --divider:color-mix(in srgb,#f0eeec 34%,transparent);
    --mute:color-mix(in srgb,#f0eeec 55%,transparent);
  }
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Fixel",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
  display:flex; flex-direction:column; justify-content:space-between;
}
/* width:100% — щоб .wrap не стискався до вмісту, коли він флекс-елемент
   (шапка й підвал на 404) */
.wrap{width:100%; padding-inline:var(--pad); max-width:var(--maxw); margin-inline:auto}
body > .tiny{width:min(100%, var(--maxw)); margin-inline:auto; padding:var(--pad) var(--pad) 0}
.tiny{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--mute)}
main{display:flex; flex-direction:column; justify-content:center; flex:1; padding-block:clamp(40px,8vw,120px)}
h1{
  margin:0; font-weight:800; letter-spacing:-.04em; line-height:.88;
  font-size:clamp(88px,22vw,320px); font-variation-settings:"wdth" 90;
}
hr{height:2px; background:var(--divider); border:0; margin:clamp(20px,3vw,36px) 0}
p{margin:0; max-width:34ch; text-wrap:pretty}
a.back{
  display:inline-block; margin-top:clamp(22px,3.4vw,40px);
  font-weight:800; font-size:clamp(20px,3.4vw,36px); letter-spacing:-.03em;
  color:var(--accent); text-decoration:none;
  border-bottom:3px solid transparent; transition:border-color 300ms cubic-bezier(.16,1,.3,1);
}
a.back:hover,a.back:focus-visible{border-bottom-color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* ── підвал сайту ─────────────────────────────────────────── */
/* контактна плашка й нижній рядок живуть в одній темній плашці,
   розділені такою ж лінійкою, як між рядками соцмереж — сторінка
   на всіх розділах закінчується цим кольором */
.site-foot{
  background:var(--deep); color:var(--deep-ink);
  --uline:2px;
  --foot-rule:color-mix(in srgb,var(--deep-ink) 26%,transparent);
  /* кегль рядка винесено в змінну, бо від нього рахується і розмір марок —
     інакше пропорція пливе між мобільним і десктопом */
  --fs-line:clamp(28px,4.6vw,60px);
  /* марки в зріст малої літери рядка, а не великої */
  --ic-cap:.56;
}
@media (min-width:700px){.site-foot{--uline:3px}}
.foot-in{padding-block:clamp(22px,3.85vh,52px)}
.site-foot .k{margin:0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; opacity:.8}
.site-foot a{color:inherit; text-decoration:none}
/* текст ліворуч, марки притиснуті до правого краю колонки */
.site-foot .lines{
  margin-top:.24em;
  display:flex; align-items:baseline; flex-wrap:wrap;
  column-gap:clamp(7px,1.1vw,14px); row-gap:clamp(16px,4vw,24px);
}
.site-foot .lines > a{
  display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  font-size:var(--fs-line); font-weight:300; text-transform:none;
  letter-spacing:-.02em; line-height:1.02; font-variation-settings:"wdth" 96;
  position:relative;
  color:color-mix(in srgb,var(--deep-ink) 60%,transparent);
  transition:color 260ms var(--ease);
}
/* лінія окремим шаром і через transform — background-size тут не інтерполюється */
.site-foot .lines > a::before{
  content:""; position:absolute; left:0; right:0; bottom:-.02em;
  height:var(--uline); background:var(--pencil);
  transform:scaleX(0); transform-origin:left;
  transition:transform 420ms var(--ease);
}
.site-foot .lines > a::after{
  content:"↗"; display:inline-block; margin-left:.12em; font-size:.34em;
  vertical-align:.9em; opacity:0; transform:translate(-.25em,.25em);
  transition:opacity 320ms var(--ease), transform 320ms var(--ease);
}
@media (hover:hover){
  .site-foot .lines > a:hover{color:var(--deep-ink)}
  .site-foot .lines > a:hover::before{transform:scaleX(1)}
  .site-foot .lines > a:hover::after{opacity:1; transform:none}
}
.site-foot .lines > a:active{color:var(--deep-ink)}
.site-foot .lines > a:active::before{transform:scaleX(1)}
.site-foot .lines > a:active::after{opacity:1; transform:none}
/* марки соцмереж у тому ж рядку, що Email і WhatsApp, і рівно у зріст його
   великої літери: розмір рахується від --fs-line, інакше пропорція пливе
   між мобільним і десктопом. Низ марки лягає на базову лінію тексту, тож
   вирівнювати нічим не треба — коробки збігаються самі */
.socials{
  display:inline-flex; align-items:center; vertical-align:baseline;
  gap:clamp(12px,1.5vw,19px); margin-left:auto;
}
.socials a{display:block; line-height:0}
.socials svg{
  display:block; width:calc(var(--fs-line) * var(--ic-cap)); height:auto;
  fill:color-mix(in srgb,var(--deep-ink) 60%,transparent);
  transition:fill 260ms var(--ease), transform 380ms var(--ease);
}
@media (hover:hover){
  .socials a:hover svg{fill:var(--deep-ink); transform:translateY(-3px)}
}
.socials a:active svg{fill:var(--deep-ink)}
.socials a:focus-visible{outline:2px solid var(--deep-ink); outline-offset:4px}
/* під 560px шість марок уже не вміщуються поряд із текстом — займають
   власний рядок і вирівнюються по лівому краю, як усе інше в плашці */
@media (max-width:560px){
  .socials{flex-basis:100%; margin-left:0}
}
.site-foot .sub{
  margin:clamp(18px,3vw,36px) 0 0; max-width:34ch; text-wrap:pretty;
  color:color-mix(in srgb,var(--deep-ink) 72%,transparent);
}
.foot-bar{
  position:relative;
  padding-block:clamp(18px,2.6vh,28px) clamp(22px,3.4vh,40px);
  display:grid; grid-template-columns:1fr auto; gap:8px 24px;
}
/* не border-top: той тягнеться і по падінгу, а лінійка має стояти рівно
   там, де лінійки між рядками соцмереж */
.foot-bar::before{
  content:""; position:absolute; top:0; left:var(--pad); right:var(--pad);
  height:var(--rule); background:var(--foot-rule);
}
.foot-bar .cols{display:flex; gap:clamp(14px,3vw,48px); flex-wrap:wrap}
.site-foot .tiny{color:color-mix(in srgb,var(--deep-ink) 62%,transparent)}
/* поле під стрілку зарезервоване падінгом, тож на ховері рядок не смикається */
.foot-bar .arch{position:relative; padding-right:1.5em; transition:color 240ms var(--ease)}
.foot-bar .arch::before{
  content:""; position:absolute; left:0; right:1.5em; bottom:-3px;
  height:var(--pen); background:var(--pencil);
  transform:scaleX(0); transform-origin:left;
  transition:transform 380ms var(--ease);
}
.foot-bar .arch::after{
  content:"↗"; position:absolute; right:.2em; bottom:0; line-height:1;
  opacity:0; transform:translate(-.3em,.3em);
  transition:opacity 320ms var(--ease), transform 320ms var(--ease);
}
@media (hover:hover){
  .foot-bar .arch:hover{color:var(--deep-ink)}
  .foot-bar .arch:hover::before{transform:scaleX(1)}
  .foot-bar .arch:hover::after{opacity:1; transform:none}
}
.site-foot :focus-visible{outline:2px solid var(--deep-ink); outline-offset:3px}
@media (max-width:560px){.foot-bar{grid-template-columns:1fr}}
/* ── плавний перехід між сторінками ──────────────────────── */
@view-transition{ navigation:auto }
@keyframes vt-out{ from{opacity:1; transform:none} to{opacity:0; transform:translateY(-10px)} }
@keyframes vt-in{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
::view-transition-old(root){ animation:vt-out 240ms var(--ease) both }
::view-transition-new(root){ animation:vt-in 380ms var(--ease) 60ms both }
@media (prefers-reduced-motion:reduce){
  ::view-transition-old(root),::view-transition-new(root){ animation:none }
}
</style>
