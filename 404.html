<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Kyrylo Rusanivsky</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171615" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{
  font-family:"Archivo";
  src:url("/archivo-var.woff2") format("woff2");
  font-weight:100 900; font-stretch:62% 125%;
  font-style:normal; font-display:swap;
}
:root{
  --bg:#f3f2f2; --ink:#201e1d; --accent:#0f8299;
  --divider:color-mix(in srgb,#201e1d 40%,transparent);
  --mute:color-mix(in srgb,#201e1d 52%,transparent);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#171615; --ink:#f0eeec;
    --divider:color-mix(in srgb,#f0eeec 34%,transparent);
    --mute:color-mix(in srgb,#f0eeec 55%,transparent);
  }
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(16px,3.2vw,48px);
}
.tiny{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--mute)}
main{display:flex; flex-direction:column; justify-content:center; flex:1; padding-block:clamp(40px,8vw,120px)}
h1{
  margin:0; font-weight:800; letter-spacing:-.04em; line-height:.88;
  font-size:clamp(88px,22vw,320px); font-variation-settings:"wdth" 90;
}
hr{height:2px; background:var(--divider); border:0; margin:clamp(20px,3vw,36px) 0}
p{margin:0; max-width:34ch; text-wrap:pretty}
a.back{
  display:inline-block; margin-top:clamp(22px,3.4vw,40px);
  font-weight:800; font-size:clamp(20px,3.4vw,36px); letter-spacing:-.03em;
  color:var(--accent); text-decoration:none;
  border-bottom:3px solid transparent; transition:border-color 300ms cubic-bezier(.16,1,.3,1);
}
a.back:hover,a.back:focus-visible{border-bottom-color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
footer{display:flex; gap:clamp(14px,3vw,48px); flex-wrap:wrap}
</style>
</head>
<body>
<span class="tiny">Kyrylo Rusanivsky</span>
<main>
  <h1>404</h1>
  <hr>
  <p>This page does not exist. It may have been moved, renamed, or it never existed at all.</p>
  <a class="back" href="/">← Back to the site</a>
</main>
<footer>
  <span class="tiny">© 2026 Kyrylo Rusanivsky</span>
  <span class="tiny">Kyiv, Ukraine</span>
</footer>
</body>
</html>
